name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild every morning so the calendar moves past events from "upcoming" to "past"
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # PREVIEW ONLY: the site is published at erdemtutal.github.io/sarahpalu until the
          # domain is connected. When going live on www.sarahpalu.com, delete these two lines.
          BASE_PATH: /sarahpalu
          SITE_URL: https://erdemtutal.github.io

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
